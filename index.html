<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Playing Google Slides</title>
    <style>
        /* Basic styling to center the presentation and make it responsive */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222; /* Dark background */
        }
        .presentation-wrapper {
            width: 100%;
            max-width: 3840px; /* Standard 16:9 presentation width */
            aspect-ratio: 16 / 9;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="presentation-wrapper">
        <iframe 
            src="https://docs.google.com/presentation/d/1_A1VV3HBFnoYIHqiOLHhhiMJ-DviF_C7ZuvsJJXL3oM/embed?start=true&loop=true&delayms=15000" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true"
            title="Embedded Google Slides Presentation">
        </iframe>
    </div>

</body>
</html>
