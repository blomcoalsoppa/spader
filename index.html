<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; 
        }

        .signage-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .left-panel {
            width: 70%;
            height: 100%;
        }

        .right-panel {
            position: relative;
            width: 30%;
            height: 100%;
            overflow: hidden;
        }

        .right-panel .sub-panel-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1;
        }


        .right-panel .sub-panel-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="signage-container">
        <div class="left-panel">
            <iframe 
                src="https://docs.google.com/presentation/d/1_A1VV3HBFnoYIHqiOLHhhiMJ-DviF_C7ZuvsJJXL3oM/embed?start=true&loop=true&delayms=18000&rm=minimal" 
                allowfullscreen="true" 
                title="Infotainment">
            </iframe>
        </div>

        <div class="right-panel">
            <div class="sub-panel-top">
                <iframe 
                    src="https://molnskylt.skanetrafiken.se/?stationId=81260&stationName=Brunnshögstorget&trafficTypes=[8]&departure=0&stopPoint=&apiKey=757a4841-33f7-48b7-9fcd-9dff99704b0d" 
                    title="Bht">
                </iframe>
            </div>
            
            <div class="sub-panel-bottom">
                <iframe 
                    src="https://molnskylt.skanetrafiken.se/?stationId=81126&stationName=Solbjer&trafficTypes=[2]&departure=0&stopPoint=&apiKey=757a4841-33f7-48b7-9fcd-9dff99704b0d" 
                    title="Regionbussar">
                </iframe>
            </div>
        </div>
    </div>

</body>
</html>
